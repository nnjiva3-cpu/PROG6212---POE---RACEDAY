name: Validate Repository Structure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-docs-folder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: docs folder is missing."
            exit 1
          fi
          echo "docs folder found."

      - name: Check required files exist in docs
        run: |
          missing=0
          if [ ! -f "docs/raceday_erd.png" ] && [ ! -f "docs/raceday_erd.pdf" ]; then
            echo "ERROR: ERD file is missing."
            missing=1
          fi
          if [ ! -f "docs/raceday_api_endpoint_plan.md" ] && [ ! -f "docs/raceday_api_endpoint_plan.pdf" ]; then
            echo "ERROR: API endpoint plan is missing."
            missing=1
          fi
          if [ ! -f "docs/raceday_schema.sql" ]; then
            echo "ERROR: SQL script is missing."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "All required files found."

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing."
            exit 1
          fi
          echo "README.md found."
